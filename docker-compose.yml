# Pile complète AndTabbax.
#
#   docker compose up -d --build     démarre tout (première fois : ~5 min)
#   docker compose logs -f backend   suit l'amorçage de la base
#   docker compose down              arrête, en gardant les données
#   docker compose down -v           arrête et efface base + fichiers déposés
#
# Application : http://localhost:8080
# Les valeurs par défaut ci-dessous suffisent à une démonstration locale ;
# copiez `.env.example` en `.env` pour les ajuster.

name: andtabbax

services:
  # --- Base de données -------------------------------------------------------
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-andtabbax}
      MARIADB_USER: ${DB_USERNAME:-andtabbax}
      MARIADB_PASSWORD: ${DB_PASSWORD:-andtabbax}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-andtabbax-root}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # --- Service de scoring IA (§8) -------------------------------------------
  ai:
    build:
      context: ./ai-service
    restart: unless-stopped
    environment:
      AI_HOST: 0.0.0.0
      AI_PORT: 8001
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health').read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # --- API Laravel -----------------------------------------------------------
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      # Le scoring doit répondre avant l'amorçage : sans lui, les projets de
      # démonstration seraient créés sans note IA (rattrapable ensuite par
      # `php artisan projects:score --all`).
      ai:
        condition: service_healthy
    environment:
      APP_NAME: AndTabbax
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost:8080}
      FRONTEND_URL: ${APP_URL:-http://localhost:8080}
      APP_LOCALE: fr
      APP_FALLBACK_LOCALE: en
      APP_FAKER_LOCALE: fr_FR
      APP_KEY: ${APP_KEY:-}

      AUTH_GUARD: api
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_ALGO: HS256

      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-andtabbax}
      DB_USERNAME: ${DB_USERNAME:-andtabbax}
      DB_PASSWORD: ${DB_PASSWORD:-andtabbax}

      # Amorçage des comptes et projets de démonstration, au premier démarrage
      # seulement (le seeder n'est pas idempotent — voir l'entrypoint).
      DB_SEED: ${DB_SEED:-true}

      CACHE_STORE: database
      QUEUE_CONNECTION: database
      SESSION_DRIVER: database
      FILESYSTEM_DISK: local
      LOG_CHANNEL: stack
      LOG_STACK: single
      LOG_LEVEL: ${LOG_LEVEL:-warning}
      # Envoi d'emails simulé : le message est composé et rendu normalement,
      # puis déposé dans la boîte consultable sur /admin/messages au lieu
      # d'être remis à un serveur SMTP. Voir backend/config/mail_simulation.php.
      # Pour un envoi réel : MAIL_MAILER=smtp + MAIL_SIMULATION_REVEAL=false.
      MAIL_MAILER: simulated
      MAIL_SIMULATION_REVEAL: "true"
      MAIL_FROM_ADDRESS: no-reply@andtabbax.sn

      AI_SCORING_URL: http://ai:8001
      AI_SCORING_TIMEOUT: 5
      AI_SCORING_ENABLED: "true"
    volumes:
      # Pièces KYC, photos de chantier, journaux, secrets engendrés : tout ce
      # que l'application écrit et qui doit survivre à une reconstruction.
      - backend-storage:/var/www/html/storage

  # --- Interface React + serveur HTTP ---------------------------------------
  web:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${APP_PORT:-8080}:80"

volumes:
  db-data:
  backend-storage:
