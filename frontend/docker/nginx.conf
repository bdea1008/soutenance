# Serveur unique de la pile AndTabbax :
#   /       → application React (fichiers construits par Vite)
#   /api    → API Laravel, en FastCGI vers le conteneur `backend`
#   /up     → sonde de santé de Laravel

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # Pièces KYC et photos de chantier : 5 Mo côté validation Laravel, marge
    # laissée pour l'enveloppe multipart (voir backend/docker/php.ini).
    client_max_body_size 12m;

    # Résolveur interne de Docker. Combiné à `fastcgi_pass $upstream`, il fait
    # résoudre le nom à chaque requête : nginx démarre même si l'API n'est pas
    # encore là, et suit son adresse si le conteneur redémarre.
    resolver 127.0.0.11 ipv6=off valid=10s;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # --- API Laravel ---------------------------------------------------------
    # `^~` : ce préfixe l'emporte sur la règle d'expression régulière plus bas,
    # sinon un téléchargement du type /api/…/photos/0 pourrait lui échapper.
    location ^~ /api {
        set $upstream backend:9000;

        include fastcgi_params;
        fastcgi_pass $upstream;

        # Laravel n'a qu'un contrôleur frontal : toutes les requêtes y entrent,
        # le routage se fait à partir de REQUEST_URI.
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;

        fastcgi_index index.php;
        fastcgi_read_timeout 60s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location = /up {
        set $upstream backend:9000;

        include fastcgi_params;
        fastcgi_pass $upstream;

        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
    }

    # --- Application React ---------------------------------------------------
    # Les fichiers produits par Vite portent une empreinte dans leur nom : ils
    # peuvent être mis en cache sans limite. index.html, lui, jamais — c'est
    # lui qui désigne la version courante du bundle.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(png|jpg|jpeg|gif|svg|webp|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Routage côté navigateur (react-router) : toute URL inconnue rend l'app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
