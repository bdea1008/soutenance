; Réglages PHP de l'API AndTabbax en conteneur.

; Les pièces KYC et les photos de chantier sont plafonnées à 5 Mo côté
; validation Laravel : on laisse une marge pour l'enveloppe multipart.
upload_max_filesize = 8M
post_max_size = 12M
max_file_uploads = 10

memory_limit = 256M
max_execution_time = 60

expose_php = Off
date.timezone = UTC

; OPcache : le code ne change pas dans une image, inutile de surveiller les
; horodatages à chaque requête.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.interned_strings_buffer = 16
